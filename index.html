<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam Restaurants - Google Maps Scraper</title>
    <meta name="description"
        content="Discover the best restaurants in Amsterdam with ratings, reviews, and detailed information scraped from Google Maps.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="background-animation"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🍽️</span>
                <h1>Amsterdam Restaurants</h1>
            </div>

            <div style="display: flex; gap: 0.5rem; align-items: center; background: rgba(255,255,255,0.15); padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);">
                <a href="index.html" style="padding: 0.4rem 0.9rem; border-radius: 999px; font-weight: 700; font-size: 0.82rem; text-decoration: none; background: #ffffff; color: #1d1d1f; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">🏛️ Amsterdam</a>
                <a href="enschede.html" style="padding: 0.4rem 0.9rem; border-radius: 999px; font-weight: 600; font-size: 0.82rem; text-decoration: none; color: #ffffff;">📍 Enschede</a>
            </div>

            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <div class="stat-value" id="totalRestaurants">0</div>
                    <div class="stat-label">Restaurants</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgRating">0</div>
                    <div class="stat-label">Avg Rating</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalReviews">0</div>
                    <div class="stat-label">Reviews</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Controls -->
        <section class="controls">
            <div class="controls-grid">
                <div class="control-group">
                    <label for="searchInput">🔍 Search</label>
                    <input type="text" id="searchInput" placeholder="Search by name, address, or cuisine...">
                </div>

                <div class="control-group">
                    <label for="cuisineFilter">🍴 Cuisine Type</label>
                    <select id="cuisineFilter">
                        <option value="">All Cuisines</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="minRating">⭐ Minimum Rating</label>
                    <select id="minRating">
                        <option value="">Any Rating</option>
                        <option value="4.5">4.5+ Stars</option>
                        <option value="4.0">4.0+ Stars</option>
                        <option value="3.5">3.5+ Stars</option>
                        <option value="3.0">3.0+ Stars</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="sortBy">📊 Sort By</label>
                    <select id="sortBy">
                        <option value="rating">Highest Rating</option>
                        <option value="reviews">Most Reviews</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>

                <div class="control-group" style="justify-content: flex-end; align-items: flex-start; padding-bottom: 6px;">
                    <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; user-select: none; margin-top: auto; padding: 10px 0;">
                        <input type="checkbox" id="showChefsToggle" checked style="width: 18px; height: 18px; cursor: pointer; accent-color: #ea580c; margin: 0;">
                        <span>👨‍🍳 Chef Partners</span>
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="applyFilters">
                    ✨ Apply Filters
                </button>
                <button class="btn btn-secondary" id="resetFilters">
                    🔄 Reset
                </button>
            </div>
        </section>

        <section class="map-section">
            <div id="map" style="height: 800px !important;"></div>
        </section>

        <section class="filters-section">
            <div class="header-controls">
                <button id="reloadData" class="btn btn-secondary">
                    🔄 Reload Data
                </button>
                <button id="exportData" class="btn btn-primary">
                    📥 Export CSV
                </button>
            </div>
        </section>

        <!-- Results Info -->
        <div class="results-info">
            <div class="results-count">
                Showing <span id="resultsCount">0</span> restaurants
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loadingState" style="display: none;">
            <div class="spinner"></div>
            <p>Loading restaurants...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🍽️</div>
            <h2>No restaurants found</h2>
            <p>Try adjusting your filters or search criteria</p>
        </div>

        <!-- Restaurants Grid -->
        <div class="restaurants-grid" id="restaurantsGrid"></div>
    </main>

    <!-- JavaScript -->
    <script src="./app.js"></script>
</body>

</html>
